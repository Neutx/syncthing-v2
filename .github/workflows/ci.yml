# Continuous integration (spec §9.1). release.yml re-runs lint, lint-ps,
# privacy-check-selftest, test and e2e through workflow_call with checks-only: true.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    inputs:
      checks-only:
        description: Run only the checks (skip build and installer-test).
        type: boolean
        default: false
    secrets:
      PRIVACY_DENYLIST:
        required: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Build-time tools, pinned (go install <module>@<version>).
  STATICCHECK: honnef.co/go/tools/cmd/staticcheck@v0.8.1
  GOVULNCHECK: golang.org/x/vuln/cmd/govulncheck@v1.8.0
  ACTIONLINT: github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
  GITLEAKS: github.com/zricethezav/gitleaks/v8@v8.30.1
  PSSCRIPTANALYZER_VERSION: 1.25.0

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # gitleaks and the privacy check scan the full history
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Executable bits of the hook and shell scripts
        run: |
          # A clone made with core.filemode=false (the Windows default) records
          # new files as 100644. Git skips a non-executable hook with only a hint,
          # so the privacy guard would silently not run for Unix contributors.
          # Fix with: git update-index --chmod=+x <path>
          listed=$(git ls-files -s -- .githooks/pre-commit '*.sh')
          if ! printf '%s\n' "$listed" | grep -q "$(printf '\t').githooks/pre-commit$"; then
            echo "::error file=.githooks/pre-commit::.githooks/pre-commit is not tracked"
            exit 1
          fi
          bad=$(printf '%s\n' "$listed" | awk -F '\t' '{ split($1, m, " "); if (m[1] != "100755") print $2 }')
          if [ -n "$bad" ]; then
            printf '%s\n' "$bad" | while IFS= read -r f; do
              echo "::error file=$f::$f is not executable in the index (mode 100644); run: git update-index --chmod=+x '$f'"
            done
            exit 1
          fi

      - name: Privacy check (tree and history)
        env:
          PRIVACY_DENYLIST: ${{ secrets.PRIVACY_DENYLIST }}
        run: |
          if [ -z "$PRIVACY_DENYLIST" ]; then
            echo "::notice title=privacy-check skipped::The PRIVACY_DENYLIST secret is not available to this run (forks and Dependabot); the denylist check did not run."
            exit 0
          fi
          bash scripts/privacy-check.sh --require
          bash scripts/privacy-check.sh --history --require

      - name: Install lint tools
        run: |
          bin="$RUNNER_TEMP/bin"
          for tool in "$STATICCHECK" "$GOVULNCHECK" "$ACTIONLINT" "$GITLEAKS"; do
            GOBIN="$bin" go install "$tool"
          done
          echo "$bin" >> "$GITHUB_PATH"

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt -l lists unformatted files:"
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: go vet
        run: |
          go vet -tags e2e ./...
          GOOS=windows go vet -tags e2e ./...

      - name: staticcheck
        run: |
          staticcheck -tags e2e ./...
          GOOS=windows staticcheck -tags e2e ./...

      - name: govulncheck
        run: |
          govulncheck -tags e2e ./...
          GOOS=windows govulncheck -tags e2e ./...

      - name: go mod tidy -diff
        run: go mod tidy -diff

      - name: shellcheck
        run: |
          shellcheck --version
          find scripts packaging -type f -name '*.sh' -print0 | xargs -0 shellcheck
          shellcheck .githooks/pre-commit

      - name: actionlint
        run: actionlint -color

      - name: gitleaks (full history)
        run: gitleaks git --redact --no-banner --verbose .

      - name: README disclaimer matches brand.Disclaimer
        run: |
          # shellcheck disable=SC2016 # the backticks are literal (a Go raw string)
          disclaimer=$(sed -n 's/^[[:space:]]*Disclaimer = `\(.*\)`$/\1/p' internal/brand/brand.go)
          if [ -z "$disclaimer" ]; then
            echo "::error file=internal/brand/brand.go::brand.Disclaimer not found"
            exit 1
          fi
          if ! grep -qF -- "$disclaimer" README.md; then
            echo "::error file=README.md::README.md must contain brand.Disclaimer verbatim, on one line"
            exit 1
          fi

  lint-ps:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          foreach ($f in Get-ChildItem -Path scripts -Filter *.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            foreach ($e in @($errors)) {
              Write-Output "::error file=scripts/$($f.Name),line=$($e.Extent.StartLineNumber)::$($e.Message)"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }

      - name: PSScriptAnalyzer
        shell: pwsh
        run: |
          $v = $env:PSSCRIPTANALYZER_VERSION
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer | Where-Object { $_.Version -eq [version]$v })) {
            Install-Module PSScriptAnalyzer -RequiredVersion $v -Repository PSGallery -Scope CurrentUser -Force
          }
          Import-Module PSScriptAnalyzer -RequiredVersion $v
          $results = @(Invoke-ScriptAnalyzer -Path scripts -Recurse)
          $results | Format-Table -AutoSize Severity, RuleName, ScriptName, Line, Message | Out-String -Width 240 | Write-Output
          $errors = @($results | Where-Object { $_.Severity -eq 'Error' -or $_.Severity -eq 'ParseError' })
          foreach ($r in $errors) {
            Write-Output "::error file=scripts/$($r.ScriptName),line=$($r.Line)::$($r.RuleName): $($r.Message)"
          }
          if ($errors.Count -gt 0) { exit 1 }

  privacy-check-selftest:
    # Proves the privacy scanners catch what they must, on dash with mawk
    # (Ubuntu) and on Git Bash plus Windows PowerShell 5.1 (Windows). The
    # pattern is a synthetic marker, not personal data.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: History mode finds merge resolutions and binary blobs
        shell: bash
        env:
          PRIVACY_DENYLIST: selftest-marker-4f9c
        run: |
          set -eu
          sh_script="$PWD/scripts/privacy-check.sh"
          ps_script=
          if [ "$RUNNER_OS" = Windows ]; then
            ps_script=$(cygpath -w "$PWD/scripts/privacy-check.ps1")
          fi
          work="$RUNNER_TEMP/privacy-selftest"
          rm -rf "$work"
          mkdir -p "$work"

          new_repo() {
            git init -q -b main "$1"
            git -C "$1" config user.name selftest
            git -C "$1" config user.email selftest@example.invalid
            git -C "$1" config core.autocrlf false
          }
          # has_marker FILE: whether FILE contains the pattern, ignoring case.
          # awk, not grep -F -i, which crashes in some Git for Windows builds.
          has_marker() {
            awk -v p="$PRIVACY_DENYLIST" 'index(tolower($0), tolower(p)) { f = 1 } END { exit !f }' "$1"
          }
          printf 'a SELFTEST-Marker-4f9c b\n' > "$work/probe"
          if ! has_marker "$work/probe"; then
            echo "::error::the self-test's own leak detector does not work"
            exit 1
          fi

          # expect DIR WANT LABEL: run --history (and -History) in DIR, require
          # exit status WANT and output that never contains the pattern.
          expect() {
            for impl in sh ps1; do
              if [ "$impl" = ps1 ] && [ -z "$ps_script" ]; then continue; fi
              rc=0
              if [ "$impl" = sh ]; then
                (cd "$1" && sh "$sh_script" --history --require) > "$work/out" 2>&1 || rc=$?
              else
                (cd "$1" && powershell -NoProfile -ExecutionPolicy Bypass -File "$ps_script" -History -Require) > "$work/out" 2>&1 || rc=$?
              fi
              cat "$work/out"
              if [ "$rc" -ne "$2" ]; then
                echo "::error::privacy-check ($impl, $3): exit status $rc, want $2"
                exit 1
              fi
              if has_marker "$work/out"; then
                echo "::error::privacy-check ($impl, $3) printed the denylisted text"
                exit 1
              fi
            done
          }

          # 1. A clean history passes.
          r="$work/clean"
          new_repo "$r"
          printf 'nothing to see\n' > "$r/a.txt"
          git -C "$r" add a.txt
          git -C "$r" commit -qm root
          expect "$r" 0 "clean history"

          # 2. Text that exists only in a merge's conflict resolution.
          r="$work/merge"
          new_repo "$r"
          printf 'base\n' > "$r/f.txt"
          git -C "$r" add f.txt
          git -C "$r" commit -qm root
          git -C "$r" checkout -qb side
          printf 'side\n' > "$r/f.txt"
          git -C "$r" commit -qam side
          git -C "$r" checkout -q main
          printf 'main\n' > "$r/f.txt"
          git -C "$r" commit -qam main
          if git -C "$r" merge -q side > /dev/null 2>&1; then
            echo "::error::the self-test merge was expected to conflict"
            exit 1
          fi
          printf 'resolved: Selftest-Marker-4F9C\n' > "$r/f.txt"
          git -C "$r" add f.txt
          git -C "$r" commit -qm merge
          expect "$r" 1 "merge resolution"

          # 3. A binary blob (NUL bytes, invalid UTF-8), deleted again.
          r="$work/binary"
          new_repo "$r"
          printf 'clean\n' > "$r/a.txt"
          git -C "$r" add a.txt
          git -C "$r" commit -qm root
          printf '\000\001\377\376PNG\000selftest-marker-4f9c\000\377\n' > "$r/blob.bin"
          git -C "$r" add blob.bin
          git -C "$r" commit -qm binary
          git -C "$r" rm -q blob.bin
          git -C "$r" commit -qm remove
          expect "$r" 1 "binary blob"

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: go test -race
        shell: bash
        env:
          CGO_ENABLED: "1" # the race detector needs cgo
        run: go test -race -count=1 ./...

  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Two-instance pairing test
        shell: bash
        run: go test -tags e2e -count=1 -timeout 15m -v ./e2e/...

  build:
    if: ${{ !inputs.checks-only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
      - name: Version
        shell: bash
        run: echo "VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"

      - name: Build (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File scripts\build.ps1 -Version $env:VERSION -SkipTests
          if ($LASTEXITCODE -ne 0) { throw "build.ps1 failed with exit code $LASTEXITCODE" }
          New-Item -ItemType Directory -Force -Path dist\pkg | Out-Null
          Copy-Item -LiteralPath dist\stv2.exe -Destination "dist\pkg\SyncThingV2-Setup-$env:VERSION-windows-x64.exe"

      - name: Build (Linux)
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          SKIP_TESTS=1 sh scripts/build.sh "$VERSION"
          stage=$(mktemp -d)
          cp dist/stv2 LICENSE THIRD_PARTY_NOTICES.md "$stage/"
          mkdir -p dist/pkg
          tar -C "$stage" -czf "dist/pkg/SyncThingV2-$VERSION-linux-x64.tar.gz" stv2 LICENSE THIRD_PARTY_NOTICES.md

      - name: Build (macOS)
        if: matrix.platform == 'macos'
        shell: bash
        env:
          COPYFILE_DISABLE: "1" # no AppleDouble files in the tarball
        run: |
          # CI smoke build: one native (arm64) binary, bundled and packed under the
          # release names that install.sh expects. release.yml builds the universal binary.
          SKIP_TESTS=1 sh scripts/build.sh "$VERSION"
          sh packaging/macos/make-app.sh "$VERSION" dist/app dist/stv2
          mkdir -p dist/pkg
          sh packaging/macos/make-dmg.sh "dist/app/SyncThing V2.app" "dist/pkg/SyncThingV2-$VERSION-macos-universal.dmg"
          tar -C dist/app -czf "dist/pkg/SyncThingV2-$VERSION-macos-universal.tar.gz" "SyncThing V2.app"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: dist/pkg/
          if-no-files-found: error
          retention-days: 7

  installer-test:
    if: ${{ !inputs.checks-only }}
    needs: build
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
          - os: macos-15
            platform: macos
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      STV2_BASE_URL: http://127.0.0.1:8000
      # GitHub's Windows runners run elevated; installer and tray refuse that without this.
      STV2_ALLOW_ADMIN: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.platform }}
          path: serve
      - name: Prepare the served release directory
        shell: bash
        run: |
          # CI serves the unbaked scripts, so the version comes from STV2_VERSION.
          echo "STV2_VERSION=0.0.0-ci.${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          cp scripts/install.ps1 scripts/install.sh serve/
          cd serve || exit 1
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum -- * > SHA256SUMS.txt
          else
            shasum -a 256 -- * > SHA256SUMS.txt
          fi
          cat SHA256SUMS.txt

      - name: Serve on 127.0.0.1:8000 (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          Start-Process -FilePath python -ArgumentList @('-m', 'http.server', '8000', '--bind', '127.0.0.1', '--directory', 'serve') -WindowStyle Hidden
      - name: Serve on 127.0.0.1:8000 (macOS, Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: nohup python3 -m http.server 8000 --bind 127.0.0.1 --directory serve > "$RUNNER_TEMP/http.log" 2>&1 &
      - name: Wait for the server
        shell: bash
        run: curl -fsS --retry 30 --retry-connrefused --retry-delay 1 -o /dev/null "$STV2_BASE_URL/SHA256SUMS.txt"

      - name: One-liner install and checks (Windows)
        if: matrix.platform == 'windows'
        shell: powershell
        run: |
          # The documented one-liner with only the URL swapped, under the Restricted execution policy.
          $oneLiner = '[Net.ServicePointManager]::SecurityProtocol = [Net.ServicePointManager]::SecurityProtocol -bor 3072; irm http://127.0.0.1:8000/install.ps1 | iex'
          powershell -NoProfile -ExecutionPolicy Restricted -Command $oneLiner
          if ($LASTEXITCODE -ne 0) { throw "The one-liner failed with exit code $LASTEXITCODE." }

          $exe = Join-Path $env:LOCALAPPDATA 'Programs\SyncThingV2\stv2.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) { throw "$exe was not installed." }
          function Invoke-Stv2([string[]]$Arguments) {
            $out = Join-Path $env:RUNNER_TEMP ('stv2-' + [guid]::NewGuid().ToString())
            $p = Start-Process -FilePath $exe -ArgumentList $Arguments -NoNewWindow -PassThru -RedirectStandardOutput "$out.out" -RedirectStandardError "$out.err"
            $null = $p.Handle
            $p.WaitForExit()
            $text = [IO.File]::ReadAllText("$out.out")
            Write-Host "stv2 $($Arguments -join ' ') -> exit $($p.ExitCode)"
            Write-Host $text
            Write-Host ([IO.File]::ReadAllText("$out.err"))
            return [pscustomobject]@{ Code = $p.ExitCode; Out = $text }
          }

          $v = Invoke-Stv2 @('version')
          if ($v.Code -ne 0 -or -not $v.Out.Contains($env:STV2_VERSION)) { throw 'stv2 version did not report the installed version.' }
          # Exit status 1 is expected: the Tailscale checks fail on runners.
          $d = Invoke-Stv2 @('doctor', '--json')
          [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'doctor.json'), $d.Out)

          $run = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          $entry = (Get-ItemProperty -LiteralPath $run -Name SyncThingV2 -ErrorAction SilentlyContinue).SyncThingV2
          if (-not $entry -or $entry -notmatch 'stv2\.exe') { throw 'The tray autostart Run value SyncThingV2 is missing.' }
          if (-not (Test-Path -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SyncThingV2')) { throw 'The Uninstall key is missing.' }

          $u = Invoke-Stv2 @('uninstall', '--yes')
          if ($u.Code -ne 0) { throw 'stv2 uninstall --yes failed.' }
          if ((Get-ItemProperty -LiteralPath $run -Name SyncThingV2 -ErrorAction SilentlyContinue)) { throw 'uninstall left the Run value SyncThingV2 behind.' }
          if (Test-Path -LiteralPath 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\SyncThingV2') { throw 'uninstall left the Uninstall key behind.' }

      - name: One-liner install and checks (macOS, Linux)
        if: matrix.platform != 'windows'
        shell: bash
        run: |
          # The documented one-liner with only the URL swapped.
          curl -fsSL http://127.0.0.1:8000/install.sh | sh

          if [ "$RUNNER_OS" = macOS ]; then
            stv2="$HOME/Applications/SyncThing V2.app/Contents/MacOS/stv2"
            autostart="$HOME/Library/LaunchAgents/io.github.neutx.syncthingv2.plist"
          else
            stv2="$HOME/.local/bin/stv2"
            autostart="$HOME/.config/autostart/stv2.desktop"
          fi
          [ -x "$stv2" ] || { echo "::error::$stv2 was not installed"; exit 1; }

          "$stv2" version | tee "$RUNNER_TEMP/version.txt"
          grep -qF -- "$STV2_VERSION" "$RUNNER_TEMP/version.txt" || { echo "::error::stv2 version did not report $STV2_VERSION"; exit 1; }
          # Exit status 1 is expected: the Tailscale checks fail on runners.
          "$stv2" doctor --json > "$RUNNER_TEMP/doctor.json" || true
          [ -f "$autostart" ] || { echo "::error::the tray autostart entry $autostart is missing"; exit 1; }

          "$stv2" uninstall --yes
          [ ! -e "$autostart" ] || { echo "::error::uninstall left $autostart behind"; exit 1; }

      - name: Check stv2 doctor --json
        shell: bash
        run: |
          py=python3
          if [ "$RUNNER_OS" = Windows ]; then py=python; fi
          "$py" - "$RUNNER_TEMP/doctor.json" <<'EOF'
          import json, os, sys

          # stv2 doctor --json has a fixed layout (internal/doctor/doctor.go,
          # schema 1). Spec §9.1's "install.* checks" are these structural
          # checks plus the checks an installation guarantees. TS*, NET001,
          # ST00x, FW001, UI002 and UPD001 depend on the runner (no Tailscale,
          # no running Syncthing, no admin, no session bus, network) and are
          # only required to have a valid status.
          CODES = ["TS001", "TS002", "ST001", "ST002", "ST003", "ST004", "ST005",
                   "SEC001", "NET001", "FW001", "UI001", "UI002", "UPD001"]  # doctor.Codes, in order
          SEVERITY = {"TS001": "high", "TS002": "high", "ST001": "high", "ST002": "high",
                      "ST003": "high", "ST004": "warn", "ST005": "info", "SEC001": "high",
                      "NET001": "warn", "FW001": "info", "UI001": "warn", "UI002": "warn",
                      "UPD001": "info"}
          GOOS = {"Windows": "windows", "Linux": "linux", "macOS": "darwin"}[os.environ["RUNNER_OS"]]

          with open(sys.argv[1], encoding="utf-8-sig") as f:
              doc = json.load(f)
          print(json.dumps(doc, indent=2))
          errors = []
          def need(cond, msg):
              if not cond:
                  errors.append(msg)

          need(doc.get("schema") == 1, f"schema is {doc.get('schema')!r}, want 1")
          need(doc.get("os") == GOOS, f"os is {doc.get('os')!r}, want {GOOS!r}")
          need(isinstance(doc.get("version"), str) and doc.get("version") != "", "version is missing")
          checks = doc.get("checks")
          findings = doc.get("findings")
          summary = doc.get("summary")
          need(isinstance(checks, list), "checks is not a list")
          need(isinstance(findings, list), "findings is not a list (it must never be null)")
          need(isinstance(summary, dict), "summary is not an object")
          if not errors:
              codes = [c.get("code") for c in checks]
              need(codes == CODES, f"check codes are {codes}, want {CODES}")
              status = {}
              for c in checks:
                  s = c.get("status")
                  need(s in ("pass", "fail", "skip"), f"{c.get('code')}: status {s!r} is not pass, fail or skip")
                  status[c.get("code")] = s
              counts = {"high": 0, "warn": 0, "info": 0}
              found = set()
              for f in findings:
                  code = f.get("code")
                  need(code in SEVERITY, f"finding with unknown code {code!r}")
                  need(f.get("severity") == SEVERITY.get(code), f"{code}: severity {f.get('severity')!r}, want {SEVERITY.get(code)!r}")
                  need(bool(f.get("title")) and bool(f.get("message")) and bool(f.get("docs")), f"{code}: finding lacks title, message or docs")
                  if f.get("severity") in counts:
                      counts[f.get("severity")] += 1
                  found.add(code)
              for k in counts:
                  need(summary.get(k) == counts[k], f"summary.{k} is {summary.get(k)!r}, but findings[] has {counts[k]}")
              need(doc.get("ok") is (counts["high"] == 0), f"ok is {doc.get('ok')!r} with {counts['high']} high findings")
              for code in CODES:
                  need((status.get(code) == "fail") == (code in found), f"{code}: status {status.get(code)!r} does not match findings[]")
              # Guaranteed by the installation.
              need(status.get("SEC001") != "fail", "SEC001 failed: the installed Syncthing exposes its control panel")
              if GOOS == "windows":
                  # UI001 must agree with the runner. The WebView2 runtime is
                  # registered under EdgeUpdate\Clients with a "pv" version;
                  # windows-latest ships it. Should an image ever lack it, a
                  # failing UI001 is correct and only reported.
                  import winreg
                  WV2 = r"Microsoft\EdgeUpdate\Clients\{F3017226-FE2A-4295-8BDF-00C3A9A7E4C5}"
                  def webview2_version():
                      for root, path in ((winreg.HKEY_LOCAL_MACHINE, "SOFTWARE\\WOW6432Node\\" + WV2),
                                         (winreg.HKEY_LOCAL_MACHINE, "SOFTWARE\\" + WV2),
                                         (winreg.HKEY_CURRENT_USER, "Software\\" + WV2)):
                          try:
                              with winreg.OpenKey(root, path) as key:
                                  v = winreg.QueryValueEx(key, "pv")[0]
                          except OSError:
                              continue
                          if v and v != "0.0.0.0":
                              return v
                      return ""
                  if webview2_version():
                      need(status.get("UI001") == "pass", f"UI001 is {status.get('UI001')!r}, but the runner has the WebView2 runtime {webview2_version()}")
                  else:
                      print(f"::warning::this runner has no WebView2 runtime; UI001 is {status.get('UI001')!r}")
              else:
                  need(status.get("UI001") == "skip", f"UI001 is {status.get('UI001')!r} on {GOOS}, want skip")
                  need(status.get("FW001") == "skip", f"FW001 is {status.get('FW001')!r} on {GOOS}, want skip")
              if GOOS != "linux":
                  need(status.get("UI002") == "skip", f"UI002 is {status.get('UI002')!r} on {GOOS}, want skip")
          for e in errors:
              print(f"::error::stv2 doctor --json: {e}")
          print(f"doctor: {len(errors)} problems with the report")
          sys.exit(1 if errors else 0)
          EOF
