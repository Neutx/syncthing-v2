# nfpm configuration for the SyncThing V2 .deb.
#
# Run from the repository root, once per architecture:
#   STV2_VERSION=1.0.0 STV2_ARCH=amd64 STV2_BINARY=dist/linux-amd64/stv2 \
#     go run github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.47.0 package \
#       --config packaging/linux/nfpm.yaml --packager deb --target dist/
# which writes dist/syncthing-v2_<version>_<arch>.deb.
#
#   STV2_VERSION  release version (x.y.z)
#   STV2_ARCH     Debian/Go architecture: amd64 or arm64
#   STV2_BINARY   path to the CGO_ENABLED=0 linux stv2 binary for that architecture
#
# The binary is static, so the package has no dependencies. The per-user setup
# (autostart entries, managed Syncthing) runs on first launch through the welcome view.
name: syncthing-v2
arch: ${STV2_ARCH}
platform: linux
version: ${STV2_VERSION}
version_schema: semver
section: net
priority: optional
# Debian policy (5.6.2) wants "Name <email>". The GitHub noreply address never
# delivers mail; bug reports go to the issue tracker at the homepage.
maintainer: SyncThing V2 contributors <Neutx@users.noreply.github.com>
vendor: SyncThing V2 contributors
homepage: https://github.com/Neutx/syncthing-v2
license: MIT
description: |-
  Tray app that pairs Syncthing devices over Tailscale.
  SyncThing V2 shows Syncthing's sync status in the system tray, pairs computers
  on the same tailnet without copying device IDs, and installs a verified
  upstream Syncthing when none is present. It is an independent project, not
  affiliated with the Syncthing Foundation or Tailscale Inc.

contents:
  - src: ${STV2_BINARY}
    dst: /usr/bin/stv2
    expand: true
    file_info:
      mode: 0755

  - src: packaging/linux/stv2.desktop
    dst: /usr/share/applications/stv2.desktop
    file_info:
      mode: 0644

  - src: LICENSE
    dst: /usr/share/doc/syncthing-v2/copyright
    file_info:
      mode: 0644
  - src: THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/syncthing-v2/THIRD_PARTY_NOTICES.md
    file_info:
      mode: 0644

  - src: assets/icons/icon-16.png
    dst: /usr/share/icons/hicolor/16x16/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-22.png
    dst: /usr/share/icons/hicolor/22x22/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-24.png
    dst: /usr/share/icons/hicolor/24x24/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-32.png
    dst: /usr/share/icons/hicolor/32x32/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-48.png
    dst: /usr/share/icons/hicolor/48x48/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-64.png
    dst: /usr/share/icons/hicolor/64x64/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-128.png
    dst: /usr/share/icons/hicolor/128x128/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-256.png
    dst: /usr/share/icons/hicolor/256x256/apps/stv2.png
    file_info:
      mode: 0644
  - src: assets/icons/icon-512.png
    dst: /usr/share/icons/hicolor/512x512/apps/stv2.png
    file_info:
      mode: 0644
