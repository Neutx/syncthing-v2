<!doctype html>
<!--
  Source for assets/social-preview.png (GitHub social preview, 1280x640).
  The dashboard and tray icons are the real app in demo mode (`stv2 demo`),
  taken from assets/screenshots/. Colours come from internal/ui/web/tokens.css.

  Render (Windows, from the assets folder):
    msedge --headless --disable-gpu --force-device-scale-factor=1 --hide-scrollbars
           --window-size=1280,640 --screenshot=social-preview.png social-preview.html
-->
<html lang="en">
<head>
<meta charset="utf-8">
<title>SyncThing V2 social preview</title>
<style>
  :root {
    --fg: #F6F8FC;
    --dim: #BCC2CE;
    --faint: #9AA3A8;
    --accent: #60A6FF;
    --st-insync: #3AC672;
    --st-syncing: #569CF6;
    --scrim: rgb(8, 9, 13);
    --card-floor: rgba(10, 12, 17, 0.408);
    --card-rim: rgba(255, 255, 255, 0.133);
    --card-top: rgba(255, 255, 255, 0.212);
    --font: "Segoe UI", -apple-system, "SF Pro Text", Cantarell, Inter, "DejaVu Sans", sans-serif;
    --font-semibold: "Segoe UI Semibold", "Segoe UI", -apple-system, "SF Pro Text", Cantarell, Inter, "DejaVu Sans", sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1280px; height: 640px; overflow: hidden; }
  body {
    position: relative;
    font-family: var(--font);
    color: var(--fg);
    background:
      radial-gradient(620px 420px at 18% 8%, rgba(38, 64, 190, 0.34), transparent 70%),
      radial-gradient(520px 480px at 96% 58%, rgba(22, 128, 128, 0.26), transparent 70%),
      radial-gradient(700px 360px at 52% 112%, rgba(96, 44, 150, 0.30), transparent 70%),
      linear-gradient(160deg, #0d1020 0%, var(--scrim) 58%, #0a0b12 100%);
  }

  /* ---- Copy column (safe area x 90..1190, y 60..580) ---- */
  .copy { position: absolute; left: 96px; top: 92px; width: 560px; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { width: 44px; height: 44px; }
  .brand span {
    font-family: var(--font-semibold); font-size: 19px; letter-spacing: 0.14em;
    text-transform: uppercase; color: var(--dim);
  }
  h1 {
    margin-top: 26px;
    font-family: var(--font-semibold); font-weight: 600;
    font-size: 96px; line-height: 0.98; letter-spacing: -0.035em;
  }
  h1 em { font-style: normal; color: var(--accent); }
  .tagline {
    margin-top: 26px; font-size: 33px; line-height: 1.22; letter-spacing: -0.01em; color: var(--fg);
  }
  .tagline b { font-family: var(--font-semibold); font-weight: 600; }
  .platforms {
    margin-top: 14px; font-size: 22px; color: var(--dim); letter-spacing: 0.01em;
  }
  .platforms i { font-style: normal; color: var(--faint); padding: 0 8px; }

  /* Tray strip: the real tray icons on a glass sill */
  .tray {
    position: absolute; left: 96px; top: 430px;
    display: flex; align-items: center; gap: 18px;
  }
  .tray-sill {
    display: flex; align-items: center; padding: 11px 16px;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,255,255,0.075), rgba(255,255,255,0.03)), var(--card-floor);
    border: 1px solid var(--card-rim);
    box-shadow: inset 0 1px 0 var(--card-top), 0 10px 30px rgba(0,0,0,0.35);
  }
  .tray-sill img { display: block; width: 390px; height: auto; } /* 624x64 strip at 0.625 */
  .tray-label { font-size: 17px; line-height: 1.3; color: var(--dim); }
  .tray-label b { display: block; font-family: var(--font-semibold); font-weight: 600; color: var(--fg); }

  .footnote {
    position: absolute; left: 96px; top: 546px;
    font-size: 15px; color: var(--faint); letter-spacing: 0.01em;
  }

  /* ---- Dashboard window: status + syncing, the real demo screenshots ---- */
  .win {
    position: absolute; display: block; height: auto;
    border-radius: 22px;
  }
  .win.back {
    width: 400px; left: 872px; top: 38px;
    opacity: 0.55; filter: saturate(0.8) brightness(0.8);
    box-shadow: 0 30px 60px rgba(0,0,0,0.5);
  }
  .win.front {
    width: 440px; left: 712px; top: 96px;
    /* the window runs off the bottom edge; fade it so the cut reads as intentional */
    -webkit-mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
            mask-image: linear-gradient(180deg, #000 86%, transparent 99%);
    box-shadow:
      0 0 0 1px rgba(255,255,255,0.06),
      0 40px 90px rgba(0,0,0,0.65),
      0 0 120px rgba(40, 80, 200, 0.18);
  }
</style>
</head>
<body>
  <div class="copy">
    <div class="brand">
      <img src="icons/icon-256.png" alt="">
      <span>Open-source tray app</span>
    </div>
    <h1>SyncThing <em>V2</em></h1>
    <p class="tagline">Syncthing + Tailscale,<br><b>paired in one click.</b></p>
    <p class="platforms">Windows<i>·</i>macOS<i>·</i>Linux</p>
  </div>

  <div class="tray">
    <div class="tray-sill"><img src="screenshots/tray-states.png" alt="Tray icon states"></div>
    <p class="tray-label"><b>Live status</b>in your tray</p>
  </div>

  <p class="footnote">Not affiliated with the Syncthing Foundation.</p>

  <img class="win back" src="screenshots/status.png" alt="">
  <img class="win front" src="screenshots/syncing.png" alt="SyncThing V2 dashboard in demo mode">
</body>
</html>
